<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<nav class="navbar yt-header fixed-top px-3 d-flex justify-content-between flex-nowrap">
  <div class="d-flex align-items-center">
    <button class="btn btn-dark me-3" id="menuBtn" aria-label="Toggle sidebar"><i data-lucide="menu"></i></button>
    <a class="navbar-brand d-flex align-items-center text-white" href="#">
      <svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true">
        <rect width="28" height="20" rx="4" fill="#FF0000"/><path d="M12 7.5L16 10L12 12.5V7.5Z" fill="white"/>
      </svg>
      <span class="yt-logo-text ms-2">YouTube</span>
    </a>
  </div>

  <div class="d-none d-md-flex w-50 mx-auto">
    <div class="input-group">
      <input id="searchInput" class="form-control yt-search-input" placeholder="Search" aria-label="Search videos">
      <button class="btn yt-search-btn" aria-label="Search"><i data-lucide="search"></i></button>
    </div>
    <button class="btn btn-dark ms-2" aria-label="Voice search"><i data-lucide="mic"></i></button>
  </div>

  <div class="d-flex align-items-center">
    <button class="btn btn-dark me-3 d-none d-lg-block" aria-label="Create"><i data-lucide="video"></i></button>
    <button class="btn btn-dark me-3 d-none d-lg-block" aria-label="Notifications"><i data-lucide="bell"></i></button>
    <div class="rounded-circle bg-secondary d-flex justify-content-center align-items-center" style="width:32px;height:32px;">PK</div>
  </div>
</nav>

<!-- SIDEBAR -->
<aside id="ytSidebar" class="yt-sidebar">
  <a href="#" class="active"><i data-lucide="home"></i> Home</a>
  <a href="#"><i data-lucide="users"></i> Subscriptions</a>
  <hr>
  <h6>You</h6>
  <a href="#"><i data-lucide="library"></i> Library</a>
  <a href="#"><i data-lucide="history"></i> History</a>
  <a href="#"><i data-lucide="clock"></i> Watch Later</a>
  <a href="#"><i data-lucide="thumbs-up"></i> Liked Videos</a>
  <hr>
  <h6>Explore</h6>
  <a href="#"><i data-lucide="tv"></i> Live</a>
  <a href="#"><i data-lucide="gamepad-2"></i> Gaming</a>
  <a href="#"><i data-lucide="newspaper"></i> News</a>
  <a href="#"><i data-lucide="activity"></i> Sports</a>
</aside>

<!-- MAIN -->
<main id="mainContent" class="yt-main-content">
  <div class="yt-category-bar" id="categoryBar"></div>
  <div class="row g-4" id="videoGrid"></div>
</main>

<!-- VIDEO PLAYER MODAL -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 py-2">
        <h6 class="modal-title text-truncate" id="playerTitle"></h6>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="ratio ratio-16x9">
        <iframe id="playerFrame" title="YouTube video player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="script.js"></script>
</body>
</html>
